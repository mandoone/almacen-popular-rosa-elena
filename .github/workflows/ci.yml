name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git diff --check
      - run: npm run scan:secrets
      - run: npm run check:go-no-go
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=critical
