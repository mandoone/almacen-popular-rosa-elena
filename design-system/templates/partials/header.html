<!--
  partial: header.html
  Portada / encabezado del informe.
  Incluir al inicio de report-base.html o de cualquier informe derivado.

  Variables:
    {{TITULO}}    → título del informe (ej: "Informe de Estado")
    {{SUBTITULO}} → subtítulo o descripción corta
    {{FECHA}}     → fecha del documento (ej: "26 de junio de 2026")
    {{VERSION}}   → etapa o versión (ej: "FASE 1 completa")

  Ruta del logo desde reports/: ../brandkit/assets/logo.png
  Ruta del logo desde templates/: ../brandkit/assets/logo.png
-->

<header style="
  background-color: var(--color-primary-dark);
  color: var(--color-white);
  padding: var(--space-16) var(--space-8);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-6);
">
  <img
    src="../brandkit/assets/logo.png"
    alt="Logo Almacén Popular Rosa Elena Morales Morales"
    style="width: 100px; height: 100px; object-fit: contain;"
  >
  <div>
    <h1 style="
      font-family: var(--font-serif);
      font-size: var(--text-4xl);
      font-weight: var(--weight-bold);
      line-height: var(--leading-tight);
      color: var(--color-white);
      margin-bottom: var(--space-2);
    ">{{TITULO}}</h1>
    <p style="
      font-family: var(--font-sans);
      font-size: var(--text-lg);
      color: var(--color-primary-light);
      font-weight: var(--weight-medium);
    ">{{SUBTITULO}}</p>
  </div>
  <div style="
    display: flex;
    gap: var(--space-6);
    font-size: var(--text-sm);
    color: var(--color-primary-light);
    border-top: 1px solid rgba(196,181,253,0.3);
    padding-top: var(--space-4);
  ">
    <span>Fecha: {{FECHA}}</span>
    <span>|</span>
    <span>Etapa: {{VERSION}}</span>
    <span>|</span>
    <span>Generado por: Claude Code</span>
  </div>
</header>
